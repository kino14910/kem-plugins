<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地播放器</title>
  <style>
    :root { color-scheme: light dark; font: 100%/1.5 system-ui, sans-serif; }
    body { margin: 0; padding: clamp(1rem, 4vw, 2rem); color: CanvasText; background: Canvas; }
    main { max-width: 48rem; margin: auto; }
    h1 { margin: 0 0 1rem; font-size: 1.5rem; }
    h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
    section { padding: 1rem; border: 1px solid GrayText; border-radius: .75rem; }
    section + section { margin-top: 1rem; }
    .controls { display: grid; gap: 1rem; }
    label { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
    input[type='file'] { max-width: 100%; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
    button, input { font: inherit; }
    button { padding: .375rem .75rem; }
    button:enabled { cursor: pointer; }
    #current, li button { overflow-wrap: anywhere; }
    #error { margin: 0; }
    ol { margin: 0; padding-inline-start: 1.75rem; }
    li button { text-align: start; border: 0; background: transparent; color: inherit; }
    [aria-current='true'] { color: LinkText; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>本地播放器</h1>
    <section class="controls" aria-label="播放控制">
      <label>音乐文件夹 <input id="folder" type="file" webkitdirectory multiple></label>
      <strong id="current">请选择音乐文件夹</strong>
      <div class="actions">
        <button id="play" type="button" disabled>播放</button>
        <button id="next" type="button" disabled>下一首</button>
        <button id="lyrics" type="button" aria-pressed="false" disabled>显示桌面歌词</button>
      </div>
      <label>播放器音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
        <output id="volume-value" for="volume">100%</output>
      </label>
      <p id="error" role="alert" hidden></p>
      <audio id="audio" preload="none"></audio>
    </section>
    <section id="tracks" hidden>
      <h2 id="track-count"></h2>
      <ol id="track-list"></ol>
    </section>
  </main>
  <script>
    (() => {
      'use strict';

      const byId = (id) => document.getElementById(id);
      const audio = byId('audio');
      const folder = byId('folder');
      const volume = byId('volume');
      const volumeValue = byId('volume-value');
      const playButton = byId('play');
      const nextButton = byId('next');
      const lyricsButton = byId('lyrics');
      const current = byId('current');
      const error = byId('error');
      const trackList = byId('track-list');
      const trackCount = byId('track-count');
      const tracks = byId('tracks');
      const relative = (file) => file.webkitRelativePath || file.name;
      let library = [];
      let trackButtons = [];
      let index = -1;
      let revision = 0;
      let disposed = false;
      let showLyrics = false;
      let url;
      let lines = [];
      let port;
      let lastCaption;

      function indexFolder(files) {
        const songs = [];
        const sidecars = new Map();
        for (const file of files) {
          if (/\.lrc$/i.test(file.name)) {
            sidecars.set(relative(file).replace(/\.lrc$/i, ''), file);
          } else if (/\.(mp3|flac|ogg|opus|wav|m4a|aac|webm)$/i.test(file.name)) {
            songs.push(file);
          }
        }
        return songs.sort((a, b) => relative(a).localeCompare(relative(b))).map((file) => ({
          file,
          path: relative(file),
          lrc: sidecars.get(relative(file).replace(/\.[^.]+$/, '')),
        }));
      }

      function parseLrc(source) {
        const lyrics = [];
        const offset = Number(source.match(/\[offset:([+-]?\d+)\]/i)?.[1] ?? 0) / 1000;
        for (const line of source.split(/\r?\n/)) {
          const stamps = [...line.matchAll(/\[(\d+):([0-5]\d(?:\.\d{1,3})?)\]/g)];
          const last = stamps.at(-1);
          if (!last) continue;
          const text = line.slice(last.index + last[0].length).trim().slice(0, 2048);
          for (const stamp of stamps) {
            lyrics.push({ at: Number(stamp[1]) * 60 + Number(stamp[2]) - offset, text });
          }
        }
        return lyrics.sort((a, b) => a.at - b.at);
      }

      function captionAt(seconds) {
        let left = 0;
        let right = lines.length;
        while (left < right) {
          const mid = (left + right) >>> 1;
          if (lines[mid].at <= seconds) left = mid + 1;
          else right = mid;
        }
        return lines[left - 1]?.text ?? '';
      }

      function report(message) {
        error.textContent = message;
        error.hidden = !message;
      }

      function updateCaption() {
        if (!port) return;
        const track = library[index];
        const text = showLyrics && track ? captionAt(audio.currentTime) || track.file.name : null;
        if (text !== lastCaption) {
          port.postMessage({ type: 'caption', text });
          lastCaption = text;
        }
      }

      function updateMenu() {
        const enabled = index >= 0;
        const playLabel = audio.paused ? '播放' : '暂停';
        const lyricsLabel = showLyrics ? '隐藏桌面歌词' : '显示桌面歌词';
        playButton.disabled = nextButton.disabled = lyricsButton.disabled = !enabled;
        playButton.textContent = playLabel;
        lyricsButton.textContent = lyricsLabel;
        lyricsButton.setAttribute('aria-pressed', String(showLyrics));
        port?.postMessage({ type: 'menu', items: [
          { id: 'play', label: playLabel, enabled },
          { id: 'next', label: '下一首', enabled },
          { id: 'lyrics', label: lyricsLabel, enabled },
        ] });
      }

      function resetAudio() {
        revision++;
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        if (url) URL.revokeObjectURL(url);
        url = undefined;
        lines = [];
      }

      function play() {
        if (!url) return;
        const generation = revision;
        audio.play().catch((reason) => {
          if (generation === revision && reason.name !== 'AbortError') report(String(reason));
        });
      }

      function select(next, autoplay = true) {
        resetAudio();
        trackButtons[index]?.removeAttribute('aria-current');
        const track = library[next];
        index = track ? next : -1;
        trackButtons[index]?.setAttribute('aria-current', 'true');
        current.textContent = track?.file.name ?? '请选择音乐文件夹';
        if (track) {
          url = URL.createObjectURL(track.file);
          audio.src = url;
          const generation = revision;
          if (track.lrc && track.lrc.size <= 1024 * 1024) {
            track.lrc.text().then((text) => {
              if (generation !== revision) return;
              lines = parseLrc(text);
              updateCaption();
            }).catch((reason) => {
              if (generation === revision) report(String(reason));
            });
          }
          if (autoplay) play();
        }
        updateMenu();
        updateCaption();
      }

      function open(files) {
        library = indexFolder(files);
        const list = document.createDocumentFragment();
        trackButtons = library.map((track, i) => {
          const row = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = track.path;
          button.addEventListener('click', () => select(i));
          row.append(button);
          list.append(row);
          return button;
        });
        trackList.replaceChildren(list);
        trackCount.textContent = `曲目 · ${library.length}`;
        tracks.hidden = !library.length;
        report(library.length ? '' : '文件夹中没有支持的音频文件');
        select(0, false);
      }

      function action(id) {
        if (disposed || index < 0) return;
        switch (id) {
          case 'play':
            if (audio.paused) play();
            else audio.pause();
            break;
          case 'next':
            select((index + 1) % library.length);
            break;
          case 'lyrics':
            showLyrics = !showLyrics;
            updateCaption();
            updateMenu();
            break;
        }
      }

      function connect(event) {
        if (window.parent === window || event.source !== window.parent || event.data?.type !== 'kem:init') return;
        const next = event.ports[0];
        if (!next) return;
        if (port) {
          port.onmessage = null;
          port.close();
        }
        port = next;
        port.onmessage = ({ data }) => {
          if (data?.type === 'action' && typeof data.id === 'string') action(data.id);
        };
        lastCaption = undefined;
        updateMenu();
        updateCaption();
      }

      folder.addEventListener('change', () => {
        if (folder.files?.length) open(folder.files);
        folder.value = '';
      });
      volume.addEventListener('input', () => {
        audio.volume = Math.min(1, Math.max(0, volume.valueAsNumber));
        volumeValue.value = `${Math.round(audio.volume * 100)}%`;
      });
      for (const button of [playButton, nextButton, lyricsButton]) {
        button.addEventListener('click', () => action(button.id));
      }
      audio.ontimeupdate = updateCaption;
      audio.onplay = audio.onpause = updateMenu;
      audio.onended = () => action('next');
      audio.onerror = () => {
        if (url && audio.error) report(audio.error.message || '无法播放此文件');
      };
      window.addEventListener('message', connect);

      // A hidden iframe keeps playing. Only dispose when its page is torn down.
      window.addEventListener('pagehide', () => {
        disposed = true;
        window.removeEventListener('message', connect);
        audio.ontimeupdate = audio.onplay = audio.onpause = audio.onended = audio.onerror = null;
        resetAudio();
        library = [];
        trackButtons = [];
        trackList.replaceChildren();
        index = -1;
        if (port) {
          port.postMessage({ type: 'menu', items: [] });
          updateCaption();
          port.onmessage = null;
          port.close();
          port = undefined;
        }
      }, { once: true });
    })();
  </script>
</body>
</html>
